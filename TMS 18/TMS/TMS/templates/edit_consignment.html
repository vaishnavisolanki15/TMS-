{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 500px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    <h2 style="margin-bottom: 20px;">✏️ Edit Consignment</h2>
    <form action="/edit_consignment/{{ consignment.Consignments_id }}" method="POST">
        
        <div class="input-group">
            <label>Assign to Trip (Optional)</label>
            <select name="trip_id" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                <option value="">-- Unassigned --</option>
                {% for t in trips %}
                <option value="{{ t.Trip_id }}" {% if consignment.trip_id == t.Trip_id %}selected{% endif %}>Trip #{{ t.Trip_id }} ({{ t.Route_From }} to {{ t.Route_To }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="input-group">
            <label>Sender Name</label>
            <input type="text" name="sender" value="{{ consignment.Sender_name }}" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>

        <div class="input-group">
            <label>Receiver Name</label>
            <input type="text" name="receiver" value="{{ consignment.Receiver_name }}" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>

        <div class="input-group">
            <label>Goods Type</label>
            <input type="text" name="goods_type" value="{{ consignment.Goods_type }}" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>

        <div class="input-group">
            <label>Weight (Tons)</label>
            <input type="number" step="0.1" name="weight" value="{{ consignment.Weight_tone }}" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>

        <div class="input-group">
            <label>Freight Amount (₹)</label>
            <input type="number" step="0.01" name="amount" value="{{ consignment.Freight_Amount }}" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>

        <div class="input-group">
            <label>Status</label>
            <select name="status" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                <option value="booked" {% if consignment.status == 'booked' %}selected{% endif %}>Booked</option>
                <option value="in_transit" {% if consignment.status == 'in_transit' %}selected{% endif %}>In Transit</option>
                <option value="delivered" {% if consignment.status == 'delivered' %}selected{% endif %}>Delivered</option>
            </select>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Update Consignment</button>
    </form>
</div>
{% endblock %}
