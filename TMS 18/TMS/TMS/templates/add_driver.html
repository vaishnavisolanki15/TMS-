{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 500px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    <h2 style="margin-bottom: 20px;">➕ Add Driver</h2>
    <form action="/add_driver" method="POST">
        <div class="input-group">
            <label>Name</label>
            <input type="text" name="name" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>License Number</label>
            <input type="text" name="license" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" name="phone" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Status</label>
            <select name="status" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                <option value="available">Available</option>
                <option value="on_trip">On Trip</option>
                <option value="leave">On Leave</option>
            </select>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Save Driver</button>
    </form>
</div>
{% endblock %}
