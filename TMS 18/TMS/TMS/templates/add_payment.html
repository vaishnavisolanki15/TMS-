{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 500px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    <h2 style="margin-bottom: 20px;">💳 Add Payment</h2>
    <form action="/add_payment" method="POST">
        
        <div class="input-group">
            <label>Select Consignment</label>
            <select name="consignment_id" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                {% for c in consignments %}
                <option value="{{ c.Consignments_id }}">Consignment #{{ c.Consignments_id }} ({{ c.Sender_name }} to {{ c.Receiver_name }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="input-group">
            <label>Amount (₹)</label>
            <input type="number" step="0.01" name="amount" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>

        <div class="input-group">
            <label>Payment Method</label>
            <select name="method" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                <option value="cash">Cash</option>
                <option value="upi">UPI</option>
                <option value="card">Card</option>
                <option value="bank_transfer">Bank Transfer</option>
            </select>
        </div>

        <div class="input-group">
            <label>Payment Date</label>
            <input type="date" name="payment_date" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>

        <div class="input-group">
            <label>Reference Number (Optional)</label>
            <input type="text" name="reference" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>

        <div class="input-group">
            <label>Status</label>
            <select name="status" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
                <option value="failed">Failed</option>
            </select>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Record Payment</button>
    </form>
</div>
{% endblock %}
