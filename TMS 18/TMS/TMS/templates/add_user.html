{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 500px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    <h2 style="margin-bottom: 20px;">➕ Add System User</h2>
    <form action="/add_user" method="POST">
        <div class="input-group">
            <label>First Name</label>
            <input type="text" name="first_name" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Last Name</label>
            <input type="text" name="last_name" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Initial Password</label>
            <input type="password" name="password" required minlength="6" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" name="phone" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        
        <div style="display: flex; gap: 15px;">
            <div class="input-group" style="flex: 1;">
                <label>System Role</label>
                <select name="role" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                    <option value="manager" {% if request.args.get('role') == 'manager' %}selected{% endif %}>Manager</option>
                    <option value="accountant" {% if request.args.get('role') == 'accountant' %}selected{% endif %}>Accountant</option>
                </select>
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Status</label>
                <select name="status" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Create User</button>
    </form>
</div>
{% endblock %}
