{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 500px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    <h2 style="margin-bottom: 20px;">➕ Add Vehicle</h2>
    <form action="/add_vehicle" method="POST">
        <div class="input-group">
            <label>Truck Number (e.g. TRK-001)</label>
            <input type="text" name="truck_no" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Registration Number (e.g. MH12AB1234)</label>
            <input type="text" name="reg_no" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Capacity (Tons)</label>
            <input type="number" step="0.1" name="capacity" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Status</label>
            <select name="status" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                <option value="available">Available</option>
                <option value="in_use">In Use</option>
                <option value="maintenance">Maintenance</option>
            </select>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Save Vehicle</button>
    </form>
</div>
{% endblock %}
