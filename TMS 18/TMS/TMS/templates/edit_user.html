{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 500px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    <h2 style="margin-bottom: 20px;">✏️ Edit System User</h2>
    <form action="/edit_user/{{ user.user_id }}" method="POST">
        <div class="input-group">
            <label>First Name</label>
            <input type="text" name="first_name" value="{{ user.First_name }}" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Last Name</label>
            <input type="text" name="last_name" value="{{ user.Last_name }}" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" value="{{ user.Email }}" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Update Password (Optional)</label>
            <input type="password" name="password" minlength="6" placeholder="Leave blank to keep current password" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" name="phone" value="{{ user.Phone if user.Phone else '' }}" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
        </div>
        
        <div style="display: flex; gap: 15px;">
            <div class="input-group" style="flex: 1;">
                <label>System Role</label>
                <select name="role" required style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                    <option value="manager" {% if user.Role == 'manager' %}selected{% endif %}>Manager</option>
                    <option value="accountant" {% if user.Role == 'accountant' %}selected{% endif %}>Accountant</option>
                </select>
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Status</label>
                <select name="status" style="width:100%; padding:10px; margin-bottom:15px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-sm);">
                    <option value="active" {% if user.Status == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if user.Status == 'inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Update User</button>
    </form>
</div>
{% endblock %}
